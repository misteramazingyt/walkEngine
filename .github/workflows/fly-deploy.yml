name: Deploy to Fly.io

# Deploys on push to main (and, for now, the Phase-1 development branch so
# the app can go live before the first merge — trim that trigger once main
# carries the app). Requires one repository secret: FLY_API_TOKEN.
#
# The bootstrap steps are idempotent: they create the Fly app and the /data
# volume on the first run and no-op afterwards, so no local flyctl setup is
# needed at all.

on:
  push:
    branches:
      - main
      - claude/motif-walk-build-cvkkpp
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  APP_NAME: motif-walk-workbench # must match `app` in fly.toml
  FLY_REGION: ord                # must match `primary_region` in fly.toml
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure app exists
        run: |
          flyctl apps list --json | grep -q "\"${APP_NAME}\"" \
            || flyctl apps create "${APP_NAME}"

      - name: Ensure data volume exists
        run: |
          flyctl volumes list --app "${APP_NAME}" --json | grep -q '"motif_walk_data"' \
            || flyctl volumes create motif_walk_data \
                 --app "${APP_NAME}" --region "${FLY_REGION}" --size 1 --yes

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
