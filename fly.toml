# fly.toml app configuration file generated for walkengine on 2026-08-02T11:48:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'walkengine'
primary_region = 'ord'

[build]

[env]
  DATABASE_URL = 'file:/data/motif-walk.db'
  PORT = '3000'

[[mounts]]
  source = 'motif_walk_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/projects'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
